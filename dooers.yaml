protocol_version: "3"
# Filled by `dooers init` / `dooers push` — leave the placeholders until then.
agent_id: 00000000-0000-0000-0000-000000000000
organization_id: 00000000-0000-0000-0000-000000000000
name: my-agent
description: Agent built with the Dooers starter (gateway LLM, managed RAG, Skills, multimodal).
# WebSocket endpoint path. Keep "/": the Dooers load balancer strips /<agent-id> before
# forwarding, and the service serves at the root (USE_API_PREFIX=false).
message_path: /
message_scheme: wss
# dooers → managed database provisioned on push (env.prod: AGENT_DATABASE_TYPE=dooers)
# postgres → you provide AGENT_DATABASE_* in env.prod
database:
  type: dooers
whatsapp:
  enabled: true
  path: /whatsapp/inbound
profile:
  summary: Assistente multimodal com base de conhecimento, Skills e WhatsApp.
  capabilities:
    - chat multimodal (texto, áudio, imagem, documentos)
    - base de conhecimento (RAG Dooers)
    - skills carregadas sob demanda
ui:
  suggested_prompts:
    - title: O que você sabe?
      prompt: O que você sabe sobre a empresa?
    - title: Resumir um documento
      prompt: Anexe um PDF e peça um resumo dos pontos principais.
